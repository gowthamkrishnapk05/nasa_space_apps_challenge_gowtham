<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrbitCare – Astronaut Health Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#e8edf1;--panel:#fff;--ink:#14202b;--mute:#5d6b78;--line:#cfd8df;--ok:#1f7a5a;--warn:#c9791a;--crit:#c2362b;--accent:#1f5fbf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
header{padding:20px 24px 8px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
h1{margin:0;font-size:24px}
header p{margin:2px 0 0;color:var(--mute)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;padding:7px 12px;border:1px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:4px;cursor:pointer}
button:hover{background:var(--ink);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:260px 1fr 300px;gap:16px;padding:16px 24px 32px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
h2{font-size:15px;margin:0 0 10px}
.crew button{display:block;width:100%;text-align:left;margin-bottom:8px;border-color:var(--line);border-left:6px solid var(--ok)}
.crew button[aria-pressed=true]{background:var(--ink);color:#fff}
.crew .w{border-left-color:var(--warn)}.crew .c{border-left-color:var(--crit)}
.crew small{display:block;opacity:.75}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.tile{border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:4px;padding:8px 10px}
.tile.w{border-left-color:var(--warn)}.tile.c{border-left-color:var(--crit)}
.tile span{display:block;color:var(--mute);font-size:13px}
.tile b{font:500 22px "IBM Plex Mono",monospace}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chartbox{height:170px;position:relative}
.wide{grid-column:1/-1}
#log{list-style:none;margin:0;padding:0;max-height:360px;overflow:auto;font-size:14px}
#log li{padding:6px 8px;border-left:4px solid var(--warn);margin-bottom:6px;background:#f6f8fa}
#log li.c{border-left-color:var(--crit)}
#log time{color:var(--mute);font-size:12px;display:block}
#summary{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.day{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.day input{flex:1}
footer{padding:0 24px 24px;color:var(--mute);font-size:13px}
@media(max-width:980px){main{grid-template-columns:1fr}.charts{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div>
    <h1>OrbitCare</h1>
    <p>Crew health monitoring for long-duration missions (simulated telemetry)</p>
  </div>
  <div class="controls">
    <button id="bSolar">Trigger solar particle event</button>
    <button id="bCO2">Trigger cabin CO₂ spike</button>
    <button id="bPause">Pause</button>
  </div>
</header>

<main>
  <section class="panel crew" aria-label="Crew list">
    <h2>Crew</h2>
    <div id="crew"></div>
    <div class="day">
      <label for="day">Mission day</label>
      <input id="day" type="range" min="1" max="180" value="30">
      <b id="dayv">30</b>
    </div>
  </section>

  <section class="panel" aria-label="Selected astronaut vitals">
    <h2 id="who"></h2>
    <div class="tiles" id="tiles"></div>
    <div class="charts">
      <div><div class="chartbox"><canvas id="cHR" aria-label="Heart rate chart"></canvas></div></div>
      <div><div class="chartbox"><canvas id="cSP" aria-label="Blood oxygen chart"></canvas></div></div>
      <div class="wide"><div class="chartbox"><canvas id="cRad" aria-label="Radiation dose rate chart"></canvas></div></div>
    </div>
    <p id="summary"></p>
  </section>

  <section class="panel" aria-label="Alerts">
    <h2>Alerts</h2>
    <ul id="log" aria-live="polite"></ul>
  </section>
</main>
<footer>Prototype for NASA Space Apps Challenge. All data is simulated. Radiation baseline is based on typical ISS dose rates (about 0.5 mSv per day) from NASA public resources.</footer>

<script>
const N = 40;
const CREW = [
  {n:"Cdr. Amara Osei", r:"Commander", base:62},
  {n:"Dr. Lin Zhao", r:"Flight surgeon", base:66},
  {n:"Mateo Ruiz", r:"Flight engineer", base:70},
  {n:"Priya Nair", r:"Pilot", base:64}
].map(c => ({...c, hr:c.base, spo2:97.5, temp:36.7, rad:21, dose:0, sleep:7,
             H:[], S:[], R:[], cool:{}}));

let sel = 0, paused = false, solar = 0, co2 = 0, t = 0;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// 0 = ok, 1 = warning, 2 = critical
const status = {
  hr:   v => (v > 130 || v < 42) ? 2 : (v > 110 || v < 48) ? 1 : 0,
  spo2: v => v < 90 ? 2 : v < 93 ? 1 : 0,
  temp: v => (v > 38.2 || v < 35.2) ? 2 : (v > 37.6 || v < 35.8) ? 1 : 0,
  rad:  v => v > 120 ? 2 : v > 60 ? 1 : 0
};
const cls = s => ["", "w", "c"][s];

function log(c, msg, s) {
  const key = msg;
  if (c.cool[key] && t - c.cool[key] < 20) return;
  c.cool[key] = t;
  const li = document.createElement("li");
  if (s === 2) li.className = "c";
  const time = document.createElement("time");
  time.textContent = new Date().toLocaleTimeString() + " · " + c.n;
  li.append(time, msg);
  const ul = document.getElementById("log");
  ul.prepend(li);
  while (ul.children.length > 40) ul.lastChild.remove();
}

function step() {
  t++;
  if (solar > 0) solar--;
  if (co2 > 0) co2--;
  const day = +document.getElementById("day").value;
  CREW.forEach((c, i) => {
    const busy = Math.random() < 0.05 ? rnd(10, 30) : 0;           // brief exertion
    const target = c.base + busy + (co2 ? 22 : 0) + (solar ? 8 : 0);
    c.hr = clamp(c.hr + (target - c.hr) * 0.25 + rnd(-2, 2), 38, 160);
    const spTarget = co2 ? 90.5 - i * 0.7 : 97.5;
    c.spo2 = clamp(c.spo2 + (spTarget - c.spo2) * 0.2 + rnd(-0.4, 0.4), 80, 100);
    c.temp = clamp(c.temp + (36.7 + (co2 ? 0.6 : 0) - c.temp) * 0.1 + rnd(-0.05, 0.05), 34, 40);
    c.rad = clamp(21 + rnd(-2, 2) + (solar ? 95 + rnd(-8, 8) : 0), 10, 250);
    c.dose = day * 0.5 + (t * 0.5) * (c.rad / 3600) * 60;          // mSv, sped up for demo
    c.sleep = clamp(7.2 - day / 180 * 1.2 + (i - 1.5) * 0.15, 4, 9); // fatigue drifts with mission length
    c.H.push(c.hr); c.S.push(c.spo2); c.R.push(c.rad);
    [c.H, c.S, c.R].forEach(a => a.length > N && a.shift());

    const checks = [
      ["Heart rate", c.hr, status.hr, Math.round(c.hr) + " bpm"],
      ["Blood oxygen", c.spo2, status.spo2, c.spo2.toFixed(1) + "%"],
      ["Body temperature", c.temp, status.temp, c.temp.toFixed(1) + " °C"],
      ["Radiation dose rate", c.rad, status.rad, Math.round(c.rad) + " µSv/h"]
    ];
    checks.forEach(([name, v, f, txt]) => {
      const s = f(v);
      if (s) log(c, (s === 2 ? "Critical: " : "Warning: ") + name + " " + txt, s);
    });
    if (c.sleep < 6.3) log(c, "Warning: sleep averaging " + c.sleep.toFixed(1) + " h, fatigue risk", 1);
  });
}

function worst(c) {
  return Math.max(status.hr(c.hr), status.spo2(c.spo2), status.temp(c.temp), status.rad(c.rad));
}

function render() {
  document.getElementById("crew").innerHTML = CREW.map((c, i) =>
    `<button data-i="${i}" aria-pressed="${i === sel}" class="${cls(worst(c))}">${c.n}<small>${c.r} · ${Math.round(c.hr)} bpm · ${c.spo2.toFixed(0)}%</small></button>`).join("");
  document.querySelectorAll("#crew button").forEach(b => b.onclick = () => { sel = +b.dataset.i; render(); });

  const c = CREW[sel];
  document.getElementById("who").textContent = c.n + " – " + c.r;
  const tiles = [
    ["Heart rate", Math.round(c.hr) + " bpm", status.hr(c.hr)],
    ["Blood oxygen", c.spo2.toFixed(1) + " %", status.spo2(c.spo2)],
    ["Temperature", c.temp.toFixed(1) + " °C", status.temp(c.temp)],
    ["Radiation rate", Math.round(c.rad) + " µSv/h", status.rad(c.rad)],
    ["Total dose", c.dose.toFixed(1) + " mSv", c.dose > 150 ? 2 : c.dose > 100 ? 1 : 0],
    ["Sleep (avg)", c.sleep.toFixed(1) + " h", c.sleep < 6 ? 2 : c.sleep < 6.5 ? 1 : 0]
  ];
  document.getElementById("tiles").innerHTML = tiles.map(([l, v, s]) =>
    `<div class="tile ${cls(s)}"><span>${l}</span><b>${v}</b></div>`).join("");

  const issues = [];
  if (status.hr(c.hr)) issues.push("heart rate is out of range");
  if (status.spo2(c.spo2)) issues.push("blood oxygen is low");
  if (status.temp(c.temp)) issues.push("temperature is abnormal");
  if (status.rad(c.rad)) issues.push("radiation exposure is elevated");
  if (c.sleep < 6.5) issues.push("sleep is below target");
  document.getElementById("summary").textContent = issues.length
    ? "Summary: " + c.n.split(" ").slice(-1)[0] + "’s " + issues.join(", ") + ". Review the alert log and consider shelter or a medical check."
    : "Summary: all of " + c.n.split(" ").slice(-1)[0] + "’s monitored vitals are within normal range.";

  updateCharts(c);
}

function mk(id, label, color, min, max, thr) {
  const labels = Array(N).fill("");
  return new Chart(document.getElementById(id), {
    type: "line",
    data: { labels, datasets: [
      { label, data: [], borderColor: color, borderWidth: 2, pointRadius: 0, tension: .3 },
      { label: "Alert limit", data: Array(N).fill(thr), borderColor: "#c2362b", borderDash: [5, 4], borderWidth: 1, pointRadius: 0 }
    ]},
    options: { animation: false, maintainAspectRatio: false, responsive: true,
      scales: { y: { min, max }, x: { ticks: { display: false } } },
      plugins: { legend: { labels: { boxWidth: 12 } } } }
  });
}
const charts = {
  hr: mk("cHR", "Heart rate (bpm)", "#1f5fbf", 40, 160, 110),
  sp: mk("cSP", "SpO₂ (%)", "#1f7a5a", 84, 100, 93),
  rad: mk("cRad", "Radiation dose rate (µSv/h)", "#c9791a", 0, 160, 60)
};
function updateCharts(c) {
  charts.hr.data.datasets[0].data = c.H;
  charts.sp.data.datasets[0].data = c.S;
  charts.rad.data.datasets[0].data = c.R;
  Object.values(charts).forEach(ch => ch.update("none"));
}

document.getElementById("bSolar").onclick = () => { solar = 25; };
document.getElementById("bCO2").onclick = () => { co2 = 20; };
document.getElementById("bPause").onclick = e => { paused = !paused; e.target.textContent = paused ? "Resume" : "Pause"; };
document.getElementById("day").oninput = e => { document.getElementById("dayv").textContent = e.target.value; };

for (let i = 0; i < 20; i++) step();
render();
setInterval(() => { if (!paused) { step(); render(); } }, 1000);
</script>
</body>
</html>
